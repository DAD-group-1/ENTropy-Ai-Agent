services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=-1
    security_opt:
      - no-new-privileges:true
    networks:
      - reverse-proxy
    volumes:
      - ./data:/root/.ollama
    ports:
      - "11434:11434"
    entrypoint: >
      sh -c "
      ollama serve &
      pid=\$$!
      until ollama list >/dev/null 2>&1; do sleep 1; done
      ollama pull llama3.2
      ollama pull nomic-embed-text:latest
      ollama pull qwen2.5:7b
      wait \$$pid
      "
